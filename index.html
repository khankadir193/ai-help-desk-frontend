<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HelpDesk AI</title>
  </head>
  <body>
    <div id="root">
      <div id="app-preloader" style="min-height:100vh;min-height:100dvh;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background-color:#F8FAFC;font-family:'Inter',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;margin:0;padding:24px;box-sizing:border-box;">
        <div style="display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;max-width:320px;width:100%;">
          <div style="width:44px;height:44px;border-radius:10px;background-color:#4F46E5;color:#FFFFFF;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 25px -5px rgba(79,70,229,0.35),0 4px 10px -2px rgba(79,70,229,0.2);">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
              <path d="M5 3v4"/>
              <path d="M19 17v4"/>
              <path d="M3 5h4"/>
              <path d="M17 19h4"/>
            </svg>
          </div>
          <div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
            <span style="font-size:18px;font-weight:600;color:#0F172A;letter-spacing:-0.015em;line-height:1.25;">HelpDesk AI</span>
            <span style="font-size:13px;color:#64748B;font-weight:500;letter-spacing:-0.005em;">Loading HelpDesk AI...</span>
          </div>
          <div style="width:140px;height:3px;background-color:#E2E8F0;border-radius:999px;overflow:hidden;position:relative;margin-top:4px;">
            <div style="position:absolute;top:0;left:0;bottom:0;width:45%;background-color:#4F46E5;border-radius:999px;animation:appPreloaderAnim 1.4s cubic-bezier(0.65,0.815,0.735,0.395) infinite;"></div>
          </div>
        </div>
        <style>
          @keyframes appPreloaderAnim {
            0%{left:-45%;width:45%}
            50%{left:25%;width:65%}
            100%{left:100%;width:45%}
          }
          @media (prefers-reduced-motion: reduce) {
            #app-preloader div { animation: none !important; }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
